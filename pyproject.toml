[project]
name = "cloudforge"
version = "0.1.0"
description = "An agentic AWS incident investigation MVP"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.42,<2",
]

[project.optional-dependencies]
agent = [
    "fastapi>=0.115,<1",
    "strands-agents>=1.56,<2",
    "uvicorn>=0.34,<1",
]
mcp-server = [
    "mcp>=2.3,<3",
]

[tool.uv]
conflicts = [
    [
        { extra = "agent" },
        { extra = "mcp-server" },
    ],
]
